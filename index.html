<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b1f">
  <title>Selamat Ulang Tahun</title>
  <script src="js/boot.js"></script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <!-- CSS: dipisah berdasarkan tanggung jawab -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/cake.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>

<body class="locked">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="sky" aria-hidden="true"></div>

  <main>
    <!-- 1. HERO: nama + tombol pemicu -->
    <section id="hero" data-bg="gradient">
      <div class="hero-in">
        <p class="kicker">Selamat ulang tahun</p>
        <div class="cakewrap" id="cake1"></div>
        <h1 id="name" class="serif" aria-label="Nama"></h1>
        <button id="start" type="button">Buka kejutan</button>
      </div>
      <div id="hint">scroll ke bawah<i>↓</i></div>
    </section>

    <!-- 2. UCAPAN -->
    <section id="ucapan">
      <div>
        <div class="cakewrap lit rv" id="cake2"></div>
        <h2 class="serif rv">Selamat ulang tahun, <em id="n2"></em>.</h2>
        <p class="rv" id="greeting"></p>
      </div>
    </section>

    <!-- 3. HARAPAN: surat di dinding -->
    <section id="harapan">
      <h2 class="sec-title serif">Wishes for you</h2>
      <div class="wall" id="wall"></div>
    </section>

    <!-- 4. MEMORY: meja foto -->
    <section id="memory">
      <h2 class="sec-title serif">Memory Table</h2>
      <p class="sec-sub">Ketuk Foto untuk memperbesar</p>
      <div class="table" id="table"></div>
    </section>
  </main>

  <footer>
    <div class="hand" id="closing"></div>
    <p>Made with ❤️</p>
  </footer>
  <!-- Lightbox: foto diperbesar -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Foto diperbesar" aria-hidden="true">
    <div class="lb-frame">
      <button type="button" class="lb-close" aria-label="Tutup">&times;</button>
      <img id="lb-img" alt="">
      <p id="lb-cap" class="lb-cap hand"></p>
    </div>
  </div>

  <input type="file" accept="image/*" id="pick" hidden>

  <!-- JS: urutan penting -->
  <script src="js/lightbox.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cake.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
